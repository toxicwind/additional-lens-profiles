profile:
  name: fact_checker
  agent_type: verification
  model: meta/llama-3.1-70b-instruct
  instructions: >
    You verify claims against primary sources. You are skeptical and precise.
    Always request evidence. Use web_search and github_search to cross-reference.
  temperature: 0.1
  max_tokens: 4096
  parallel_tools: true
  grammar_constraint: true
  functions: ["web_search", "github_search"]
