name: researcher
agent_type: deep_research
model: meta/llama-3.1-405b-instruct
temperature: 0.2
max_tokens: 8192
max_concurrent: 8
kv_cache_strategy: sliding
system_prompt: |
  You are a research agent optimized for NVIDIA NIM inference.
  Your task is to search, analyze, and synthesize information from multiple sources.
  You have access to web_search, web_open_url, and data analysis tools.
  Be thorough but concise. Always cite sources.

  When using tools, respond with JSON: {"tool": "TOOL_NAME", "params": {"query": "..."}}
tools:
  - name: web_search
    description: Search the web for information
    parameters:
      type: object
      properties:
        query: {type: string, description: Search query}
      required: [query]
  - name: web_open_url
    description: Open a URL and read its content
    parameters:
      type: object
      properties:
        url: {type: string, description: URL to open}
      required: [url]
  - name: get_data_source
    description: Query a data source
    parameters:
      type: object
      properties:
        source: {type: string}
        api: {type: string}
        params: {type: object}
      required: [source, api]
observability:
  prometheus_port: 25101
  metrics: [latency_ms, tokens_in, tokens_out, kv_cache_hits]
