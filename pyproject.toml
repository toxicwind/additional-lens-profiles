[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "volume-master"
version = "2.0.0"
description = "VOLUME Master — Modular EPUB3 splitter with musepool async, MCP skills, and agentic optimization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "toxicwind"},
]
keywords = ["epub", "splitter", "musepool", "mcp", "agentic", "lms"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: XML",
]

dependencies = [
    "ebooklib>=0.18",
    "fonttools>=4.50",
    "gradio>=5.8",
    "httpx[http2]>=0.27",
    "aiohttp>=3.9",
    "pydantic>=2.7",
    "rich>=13.7",
    "typer>=0.12",
    "watchdog>=4.0",
    "python-dotenv>=1.0",
    "duckduckgo-search>=6.0",
    "openai>=1.40",
    "pillow>=10.3",
    "lxml>=5.2",
    "cssselect>=1.2",
    "tinycss2>=1.3",
    "zopfli>=0.2",
    "brotli>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "black>=24.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
gpu = [
    "nvidia-ml-py>=12.535",
    "pynvml>=11.5",
]
all = ["volume-master[dev,gpu]"]

[project.scripts]
volume = "volume.cli:main"
volume-web = "volume.ui.gradio.app:main"
volume-agent = "agents.orchestrator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/volume", "src/musepool", "src/skills"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312", "py313"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
